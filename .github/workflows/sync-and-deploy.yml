name: Sync Fork & Deploy to Vercel

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # When running in Kapil's upstream repository (KapilLopchanTamang/TopUp)
      - name: Sync from Upstream to Prasanga Fork
        if: github.repository == 'KapilLopchanTamang/TopUp' && github.event_name == 'push'
        run: |
          echo "Pushing latest main commit from Kapil repository to prasangapokharel/TopUp..."
          git remote add fork https://x-access-token:${{ secrets.FORK_SYNC_TOKEN }}@github.com/prasangapokharel/TopUp.git || true
          git push fork main:main
          echo "Successfully synced to prasangapokharel/TopUp!"

      # When running in Prasanga's fork (prasangapokharel/TopUp) on schedule or manual run
      - name: Pull from Upstream
        id: fork_pull
        if: github.repository == 'prasangapokharel/TopUp' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/KapilLopchanTamang/TopUp.git || true
          git fetch upstream main
          
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $BEHIND_COUNT"
          
          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "Syncing changes from upstream..."
            git merge --ff-only upstream/main || git merge upstream/main -m "chore: sync fork with upstream"
            git push origin main
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fork is already up to date with upstream."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      # Trigger Vercel Production Deploy Hook
      - name: Trigger Vercel Production Deploy Hook
        if: |
          (github.repository == 'KapilLopchanTamang/TopUp' && github.event_name == 'push') ||
          (github.repository == 'prasangapokharel/TopUp' && (github.event_name == 'push' || steps.fork_pull.outputs.synced == 'true' || github.event_name == 'workflow_dispatch'))
        run: |
          echo "Triggering Vercel production deploy hook for godsupercell1-gmailcoms-projects..."
          HOOK_URL="${{ secrets.VERCEL_DEPLOY_HOOK || 'https://api.vercel.com/v1/integrations/deploy/prj_HUV8aE6qWIAnDHHYw7kVnQh9gDNA/YYVQFUcgYf' }}"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$HOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Deploy hook successfully triggered Vercel build!"
          else
            echo "Failed to trigger deploy hook (HTTP $HTTP_CODE)"
            exit 1
          fi
